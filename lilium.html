<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Lilium</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--p:#ff4d97;--p2:#c2185b;--lav:#e9d9ff;--blush:#ffe3ee;--peach:#ffd9c9;--t:#4a1d38;--card:rgba(255,255,255,.72)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Vazirmatn,Tahoma,system-ui,sans-serif;color:var(--t);background:linear-gradient(160deg,var(--blush),var(--lav) 60%,var(--peach));min-height:100vh;padding:14px 14px 90px}
h2{margin:6px 0 10px;font-size:22px;color:var(--p2)}h3{margin:0 0 8px;font-size:15px}
.c{background:var(--card);backdrop-filter:blur(8px);border-radius:26px;padding:14px;margin-bottom:12px;box-shadow:0 6px 20px rgba(194,24,91,.1)}
button,input,textarea,select{font:inherit;color:inherit}
button{border:0;border-radius:18px;padding:9px 14px;background:linear-gradient(135deg,var(--p),#ff7ab8);color:#fff;font-weight:700;cursor:pointer}
button.s{background:#fff;color:var(--p2)}
input,textarea,select{width:100%;border:2px solid var(--blush);border-radius:16px;padding:9px 12px;background:#fff;margin:4px 0}
.r{display:flex;gap:8px;align-items:center}.r>*{flex:1}.r>button{flex:0 0 auto}
.row{display:flex;align-items:center;gap:8px;padding:6px 0}.row span{flex:1}.done span{text-decoration:line-through;opacity:.5}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--p);background:#fff;padding:0;flex:0 0 26px;color:#fff}.on{background:var(--p)}
.moods button{font-size:26px;background:#fff;padding:6px 8px}.moods .sel{background:var(--lav);outline:3px solid var(--p)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-radius:24px 24px 0 0;box-shadow:0 -4px 20px rgba(194,24,91,.15)}
nav button{flex:1;background:none;color:#a77;font-size:11px;padding:6px 2px}nav button b{display:block;font-size:22px}nav .act{color:var(--p2)}
.big{font-size:64px;text-align:center}.tm{font-size:54px;text-align:center;font-weight:800;color:var(--p2)}
.bar{height:12px;background:#fff;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),#ffb3d3)}
.cols{display:flex;align-items:flex-end;gap:6px;height:110px}.cols div{flex:1;text-align:center;font-size:11px}.cols i{display:block;background:linear-gradient(0deg,var(--p),#ffb3d3);border-radius:10px 10px 4px 4px;min-height:4px}
.wilt{filter:grayscale(.6)}.q{text-align:center;font-weight:700;color:var(--p2)}.tot{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tot div{background:#fff;border-radius:16px;padding:10px;text-align:center}.tot b{display:block;font-size:20px;color:var(--p)}
</style></head><body><div id="app"></div><nav id="nav"></nav>
<script>
const tg=window.Telegram&&Telegram.WebApp;try{tg.ready();tg.expand()}catch(e){}
const L={today:['امروز','Today'],timer:['تایمر','Timer'],cycle:['چرخه','Cycle'],stats:['آنالیز','Stats'],cal:['تقویم','Calendar'],hi:['سلام','Hi'],water:['آب (لیوان)','Water (glasses)'],mood:['حال امروز','Mood'],tasks:['تسک‌ها','To-do'],habits:['عادت‌ها','Habits'],add:['افزودن','Add'],newTask:['تسک جدید','New task'],newHab:['عادت جدید','New habit'],note:['یادداشت امروز','Note for today'],name:['اسمت؟','Your name?'],birth:['تاریخ تولد','Birth date'],start:['شروع','Start'],pause:['توقف','Pause'],reset:['صفر','Reset'],focus:['تمرکز','Focus'],brk:['استراحت','Break'],study:['مطالعه‌ی امروز','Study today'],mn:['دقیقه','min'],cStart:['شروع پریود','Period started'],cEnd:['پایان پریود','Period ended'],next:['پیش‌بینی بعدی','Next expected'],none:['هنوز ثبت نشده','Nothing logged yet'],week:['این هفته','This week'],follow:['درصد پیگیری','Follow-through'],total:['مجموع کل','All-time totals'],tStudy:['ساعت مطالعه','Study hours'],tTasks:['تسک انجام‌شده','Tasks done'],tWater:['لیوان آب','Glasses of water'],tDays:['روز استفاده','Days used'],goal:['هدف این هفته','Goal this week'],big:['هدف بزرگم ✨','My big goal ✨'],ev:['تاریخ مهم (امتحان، تولد...)','Important date (exam, birthday...)'],bday:['تولد تو 🎂','Your birthday 🎂'],go:['بزن بریم 💗','Let\'s go 💗'],lang:['English','فارسی'],wilted:['لیلیوم تشنه‌ست! امروز یه کاری ثبت کن','Lilium is wilting! Log something today'],grow:['لیلیوم داره رشد می‌کنه','Lilium is growing'],pts:['امتیاز','points'],q:['امروز مال توئه 💪🏻','Today is yours 💪🏻','هدفتو بگیر، دختر! ✨','Chase your goal, girl! ✨','تو درخشانی 🦋','You are glowing 🦋','قدم کوچیک هم قدمه 🍓','Small steps still count 🍓','جسور باش، نرم بمون 💅🏻','Be bold, stay soft 💅🏻']};
const q=()=>{const a=L.q,i=(new Date().getDate()%5)*2+(S.lang=='en'?1:0);return a[i]};
const t=k=>L[k][S.lang=='en'?1:0];
const pad=n=>String(n).padStart(2,'0'),iso=d=>{d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const ago=n=>{const d=new Date();d.setDate(d.getDate()-n);return iso(d)};
const fm=s=>new Date(s+'T12:00').toLocaleDateString(S.lang=='en'?'en-US':'fa-IR-u-ca-persian',{month:'short',day:'numeric'});
const diff=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
let S=null;try{S=JSON.parse(localStorage.getItem('lil'))}catch(e){}
S=S||{lang:'fa',habits:[],cycle:[],ev:{},days:{},pts:0,tot:{study:0,tasks:0,water:0,days:0},goal:'',big:'',last:'',name:'',birth:'',sacc:0};
const save=()=>{const j=JSON.stringify(S);try{localStorage.setItem('lil',j)}catch(e){}try{if(j.length<3900)tg.CloudStorage.setItem('lil',j)}catch(e){}};
try{tg.CloudStorage.getItem('lil',(e,v)=>{if(!e&&v&&!localStorage.getItem('lil')){S=JSON.parse(v);R()}})}catch(e){}
Object.keys(S.days).forEach(k=>{if(diff(k,iso())>6)delete S.days[k]});
const D=()=>S.days[iso()]||(S.days[iso()]={water:0,mood:'',tasks:[],hab:{},note:'',study:0});
const touch=(p)=>{const f=S.last!==iso();if(f)S.tot.days++;S.last=iso();S.pts+=p||0;D()};
let tab='today',tm={left:1500,run:false,mode:'f'},iv=null;
const wilted=()=>S.last&&diff(S.last,iso())>=2;
function flower(){const p=S.pts;return wilted()?'🥀':p<10?'🌱':p<40?'🌿':p<100?'🌷':'🌸'}
function nav(){document.getElementById('nav').innerHTML=[['today','🌸'],['timer','⏱️'],['cycle','🌙'],['stats','📊'],['cal','🗓️']].map(x=>`<button class="${tab==x[0]?'act':''}" onclick="tab='${x[0]}';R()"><b>${x[1]}</b>${t(x[0])}</button>`).join('')}
function R(){document.documentElement.lang=S.lang;document.documentElement.dir=S.lang=='en'?'ltr':'rtl';nav();const a=document.getElementById('app');
if(!S.name){a.innerHTML=`<h2>Lilium 🌸</h2><div class="c"><h3>${t('name')}</h3><input id="nm"><h3>${t('birth')}</h3><input id="bd" type="date"><div class="r"><button class="s" onclick="S.lang=S.lang=='en'?'fa':'en';R()">${t('lang')}</button><button onclick="ob()">${t('go')}</button></div></div>`;document.getElementById('nav').innerHTML='';return}
a.innerHTML={today,timer:timerV,cycle:cycleV,stats,cal}[tab]();if(tab=='timer')tick(true)}
function ob(){const n=nm.value.trim();if(!n)return;S.name=n;S.birth=bd.value;touch(0);save();R()}
function today(){const d=D();return `<h2>${t('hi')} ${S.name} ${flower()}</h2><p class="q">${q()}</p>
<div class="c"><h3>💧 ${t('water')}: ${d.water}/8</h3><div class="bar"><i style="width:${Math.min(100,d.water*12.5)}%"></i></div><div class="r" style="margin-top:8px"><button class="s" onclick="W(-1)">−</button><button onclick="W(1)">+ 🥤</button></div></div>
<div class="c"><h3>${t('mood')}</h3><div class="moods r">${['😍','😊','😐','😢','😡'].map(m=>`<button class="${d.mood==m?'sel':''}" onclick="M('${m}')">${m}</button>`).join('')}</div></div>
<div class="c"><h3>${t('tasks')}</h3>${d.tasks.map((k,i)=>`<div class="row ${k.d?'done':''}"><button class="chk ${k.d?'on':''}" onclick="TK(${i})">${k.d?'✓':''}</button><span>${esc(k.t)}</span><button class="s" onclick="D().tasks.splice(${i},1);save();R()">✕</button></div>`).join('')}<div class="r"><input id="ti" placeholder="${t('newTask')}"><button onclick="AT()">${t('add')}</button></div></div>
<div class="c"><h3>${t('habits')}</h3>${S.habits.map((h,i)=>{const o=d.hab[i];return `<div class="row ${o?'done':''}"><button class="chk ${o?'on':''}" onclick="HB(${i})">${o?'✓':''}</button><span>${esc(h.n)}</span><b>🔥${h.s||0}</b><button class="s" onclick="S.habits.splice(${i},1);d.hab={};save();R()">✕</button></div>`}).join('')}<div class="r"><input id="hi" placeholder="${t('newHab')}"><button onclick="AH()">${t('add')}</button></div></div>
<div class="c"><h3>${t('note')}</h3><textarea rows="2" onchange="D().note=this.value;touch(1);save()">${esc(d.note)}</textarea></div>
<button class="s" onclick="S.lang=S.lang=='en'?'fa':'en';save();R()">${t('lang')}</button>`}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function W(n){const d=D();if(n<0&&!d.water)return;d.water+=n;S.tot.water+=n;touch(n>0?1:0);save();R()}
function M(m){const d=D();if(!d.mood)touch(1);d.mood=m;save();R()}
function AT(){const v=ti.value.trim();if(!v)return;D().tasks.push({t:v,d:0});save();R()}
function TK(i){const k=D().tasks[i];k.d=!k.d;S.tot.tasks+=k.d?1:-1;touch(k.d?5:0);if(!k.d)S.pts=Math.max(0,S.pts-5);save();R()}
function AH(){const v=hi.value.trim();if(!v)return;S.habits.push({n:v,s:0,l:''});save();R()}
function HB(i){const d=D(),h=S.habits[i];if(d.hab[i]){d.hab[i]=0;h.s=Math.max(0,h.s-1);h.l=h.s?ago(1):'';S.pts=Math.max(0,S.pts-3)}else{d.hab[i]=1;h.s=h.l==ago(1)?h.s+1:1;h.l=iso();touch(3)}save();R()}
function timerV(){const p=S.pts,nx=p<10?10:p<40?40:100,pr=p>=100?100:Math.round(p/nx*100);return `<h2>${t('timer')}</h2>
<div class="c"><div class="big ${wilted()?'wilt':''}">${flower()}</div><p class="q">${wilted()?t('wilted'):t('grow')} · ${p} ${t('pts')}</p><div class="bar"><i style="width:${pr}%"></i></div></div>
<div class="c"><div class="r" style="justify-content:center"><button class="${tm.mode=='f'?'':'s'}" onclick="SM('f')">${t('focus')} 25</button><button class="${tm.mode=='b'?'':'s'}" onclick="SM('b')">${t('brk')} 5</button></div><div class="tm" id="tt"></div><div class="r"><button id="tb" onclick="TG()"></button><button class="s" onclick="SM(tm.mode)">${t('reset')}</button></div><p class="q" id="ts"></p></div>`}
function SM(m){tm={left:m=='f'?1500:300,run:false,mode:m};clearInterval(iv);R()}
function TG(){tm.run=!tm.run;clearInterval(iv);if(tm.run)iv=setInterval(()=>{tm.left--;if(tm.mode=='f'){D().study++;S.tot.study++;S.sacc++;if(S.sacc%300==0){touch(3)}else touch(0)}if(tm.left<=0){try{tg.HapticFeedback.notificationOccurred('success')}catch(e){}SM(tm.mode=='f'?'b':'f');return}tick();if(tm.left%10==0)save()},1000);else save();tick(true)}
function tick(){const e=document.getElementById('tt');if(!e)return;e.textContent=pad(Math.floor(tm.left/60))+':'+pad(tm.left%60);document.getElementById('tb').textContent=tm.run?t('pause'):t('start');document.getElementById('ts').textContent=t('study')+': '+Math.floor(D().study/60)+' '+t('mn')}
function cycleV(){const c=S.cycle,l=c[c.length-1],open=l&&!l.e;let nx='';if(l){let ls=c.length>1?c.slice(1).map((x,i)=>diff(c[i].s,x.s)):[28];let avg=Math.round(ls.reduce((a,b)=>a+b,0)/ls.length);const d=new Date(l.s+'T12:00');d.setDate(d.getDate()+avg);nx=iso(d)}
return `<h2>🌙 ${t('cycle')}</h2><div class="c">${open?`<button onclick="CE()">${t('cEnd')}</button>`:`<button onclick="CS()">${t('cStart')}</button>`}</div><div class="c"><h3>${t('next')}</h3><div class="q">${nx?fm(nx)+' ('+diff(iso(),nx)+' '+(S.lang=='en'?'days':'روز')+')':t('none')}</div></div><div class="c">${c.slice().reverse().map(x=>`<div class="row"><span>${fm(x.s)} → ${x.e?fm(x.e):'…'}</span></div>`).join('')||t('none')}</div>`}
function CS(){S.cycle.push({s:iso(),e:''});touch(1);save();R()}function CE(){S.cycle[S.cycle.length-1].e=iso();save();R()}
function score(k){const d=S.days[k];if(!d)return 0;const p=[Math.min(1,d.water/8)];if(d.tasks.length)p.push(d.tasks.filter(x=>x.d).length/d.tasks.length);const hc=S.habits.length;if(hc)p.push(Object.values(d.hab).filter(Boolean).length/hc);return p.reduce((a,b)=>a+b,0)/p.length}
function stats(){const ds=[6,5,4,3,2,1,0].map(ago),mx=Math.max(1,...ds.map(k=>(S.days[k]||{study:0}).study)),pc=Math.round(ds.reduce((a,k)=>a+score(k),0)/7*100),T=S.tot;
return `<h2>📊 ${t('stats')}</h2><div class="c"><h3>${t('week')}</h3><div class="cols">${ds.map(k=>{const d=S.days[k]||{study:0,mood:''};return `<div><i style="height:${Math.round(d.study/mx*70)}px"></i>${d.mood||'·'}<br>${fm(k).split(' ')[0]}</div>`}).join('')}</div></div><div class="c"><h3>${t('follow')}: ${pc}%</h3><div class="bar"><i style="width:${pc}%"></i></div></div><div class="c"><h3>${t('total')}</h3><div class="tot"><div><b>${(T.study/3600).toFixed(1)}</b>${t('tStudy')}</div><div><b>${T.tasks}</b>${t('tTasks')}</div><div><b>${T.water}</b>${t('tWater')}</div><div><b>${T.days}</b>${t('tDays')}</div></div></div>`}
function cal(){const ev=Object.keys(S.ev).filter(k=>k>=iso()).sort();return `<h2>🗓️ ${t('cal')}</h2><div class="c"><h3>${t('big')}</h3><input value="${esc(S.big)}" onchange="S.big=this.value;save()"><h3>${t('goal')}</h3><textarea rows="2" onchange="S.goal=this.value;save()">${esc(S.goal)}</textarea></div><div class="c"><h3>${t('ev')}</h3><input id="ed" type="date"><div class="r"><input id="et"><button onclick="AE()">${t('add')}</button></div>${S.birth?`<div class="row"><span>${t('bday')}: ${fm(S.birth.slice(5).replace(/^/,new Date().getFullYear()+'-'))}</span></div>`:''}${ev.map(k=>`<div class="row"><span>${fm(k)} · ${esc(S.ev[k])}</span><button class="s" onclick="delete S.ev['${k}'];save();R()">✕</button></div>`).join('')}</div>`}
function AE(){if(!ed.value||!et.value.trim())return;S.ev[ed.value]=et.value.trim();save();R()}
R();
</script></body></html>
